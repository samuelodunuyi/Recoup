name: eval

# Agent-quality regression gate (#18). Runs on demand and nightly rather than on
# every push, since it calls a paid LLM API. Provide ANTHROPIC_API_KEY as a repo
# secret. Runs without a DB (RAG falls back to built-in strategies).
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC daily

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      LLM_PRIMARY: anthropic
      LLM_FALLBACK: openai
      ANTHROPIC_MODEL: claude-haiku-4-5   # cheaper for the nightly gate
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run eval (no judge)
        run: python -m eval.runner --no-judge
      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-scorecard
          path: eval/scorecard.md
