<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recoup — demo</title>
  <style>
    :root { --wa-bg:#e5ddd5; --wa-green:#075e54; --bubble-in:#fff; --bubble-out:#dcf8c6; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,Segoe UI,Roboto,sans-serif; background:#f0f0f0; color:#111; }
    .wrap { display:flex; gap:16px; max-width:1000px; margin:24px auto; padding:0 16px; align-items:flex-start; }
    .phone { width:380px; background:var(--wa-bg); border-radius:12px; overflow:hidden; box-shadow:0 2px 12px rgba(0,0,0,.15); }
    .phone header { background:var(--wa-green); color:#fff; padding:12px 16px; font-weight:600; }
    .phone header small { display:block; font-weight:400; opacity:.8; font-size:12px; }
    .thread { height:460px; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:8px; }
    .bubble { max-width:78%; padding:8px 10px; border-radius:8px; font-size:14px; line-height:1.35; box-shadow:0 1px 1px rgba(0,0,0,.08); white-space:pre-wrap; }
    .in { align-self:flex-start; background:var(--bubble-in); }
    .out { align-self:flex-end; background:var(--bubble-out); }
    .sys { align-self:center; background:#fff5c4; font-size:12px; color:#555; border-radius:6px; padding:4px 8px; }
    .composer { display:flex; gap:8px; padding:10px; background:#f0f0f0; }
    .composer input { flex:1; padding:9px 12px; border:1px solid #ccc; border-radius:20px; font-size:14px; }
    .composer button, .panel button { background:var(--wa-green); color:#fff; border:0; border-radius:20px; padding:9px 16px; cursor:pointer; font-size:14px; }
    .panel { flex:1; background:#fff; border-radius:12px; padding:16px; box-shadow:0 2px 12px rgba(0,0,0,.08); min-width:300px; }
    .panel h3 { margin:0 0 12px; font-size:15px; }
    .row { display:flex; gap:8px; margin-bottom:8px; }
    .row label { flex:1; font-size:12px; color:#444; display:flex; flex-direction:column; gap:3px; }
    .row select, .row input { padding:6px; border:1px solid #ccc; border-radius:6px; font-size:13px; }
    .meta { font-size:13px; margin-top:14px; border-top:1px solid #eee; padding-top:12px; }
    .meta div { margin-bottom:6px; }
    .tag { display:inline-block; background:#eef; color:#225; border-radius:4px; padding:1px 6px; font-size:12px; }
    .action { background:#e7f7ed; color:#0a6; }
    .muted { color:#888; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="phone">
      <header>
        Recoup recovery agent
        <small id="ctx-line">insufficient_funds · paystack · english</small>
      </header>
      <div class="thread" id="thread"></div>
      <div class="composer">
        <input id="msg" placeholder="Type a customer reply…" autocomplete="off" />
        <button id="send">Send</button>
      </div>
    </div>

    <div class="panel">
      <h3>Scenario setup</h3>
      <div class="row">
        <label>Customer<input id="name" value="Ada" /></label>
        <label>Amount<input id="amount" type="number" value="5000" /></label>
      </div>
      <div class="row">
        <label>Decline code
          <select id="decline_code">
            <option>insufficient_funds</option>
            <option>card_declined</option>
            <option>expired_card</option>
            <option>do_not_honour</option>
            <option>transaction_limit</option>
            <option>mobile_money_timeout</option>
          </select>
        </label>
        <label>Processor
          <select id="processor">
            <option>paystack</option>
            <option>flutterwave</option>
            <option>mobile_money</option>
          </select>
        </label>
        <label>Language
          <select id="language">
            <option>english</option>
            <option>pidgin</option>
          </select>
        </label>
      </div>
      <button id="start">Start new failed-payment thread</button>

      <div class="meta" id="meta">
        <div class="muted">Last turn details appear here.</div>
      </div>
    </div>
  </div>

<script>
let conversationId = null;

const $ = (id) => document.getElementById(id);
const thread = $("thread");

function bubble(cls, text) {
  const d = document.createElement("div");
  d.className = "bubble " + cls;
  d.textContent = text;
  thread.appendChild(d);
  thread.scrollTop = thread.scrollHeight;
}

function newConversationId() {
  return "demo-" + Math.random().toString(36).slice(2, 10);
}

function context() {
  return {
    customer_name: $("name").value,
    decline_code: $("decline_code").value,
    processor: $("processor").value,
    language: $("language").value,
    amount: parseFloat($("amount").value) || 0,
    currency: "NGN",
  };
}

function renderMeta(data) {
  const link = data.action && data.action.type === "SEND_PAYMENT_LINK"
    ? '<div>🔗 <span class="tag action">payment link attached</span></div>' : "";
  $("meta").innerHTML = `
    <div>Route: <span class="tag">${data.route}</span></div>
    <div>Action: <span class="tag action">${data.action ? data.action.type : "—"}</span>
      ${data.action && data.action.schedule_for ? "· " + data.action.schedule_for : ""}</div>
    ${link}
    <div>Promises: ${(data.promises || []).map(p => '<span class="tag">'+p+'</span>').join(" ") || '<span class="muted">none</span>'}</div>
    <div>Retrieved from: ${(data.strategy_sources || []).join(", ") || "—"}</div>
    <div>Cost so far: <span class="tag">$${(data.cost && data.cost.total_cost_usd || 0).toFixed(5)}</span></div>
  `;
}

async function send(message) {
  const body = { conversation_id: conversationId, message, ...context() };
  const res = await fetch("/chat", {
    method: "POST", headers: {"content-type":"application/json"}, body: JSON.stringify(body),
  });
  if (!res.ok) { bubble("sys", "Error: " + (await res.text())); return; }
  const data = await res.json();
  bubble("in", data.reply || "(no reply)");
  renderMeta(data);
}

$("start").onclick = async () => {
  conversationId = newConversationId();
  thread.innerHTML = "";
  const c = context();
  $("ctx-line").textContent = `${c.decline_code} · ${c.processor} · ${c.language}`;
  bubble("sys", `Payment failed: ${c.amount} ${c.currency} · ${c.decline_code}`);
  await send(""); // initial failed-payment event
};

$("send").onclick = async () => {
  if (!conversationId) { bubble("sys", "Click 'Start' first."); return; }
  const text = $("msg").value.trim();
  if (!text) return;
  $("msg").value = "";
  bubble("out", text);
  await send(text);
};
$("msg").addEventListener("keydown", (e) => { if (e.key === "Enter") $("send").click(); });
</script>
</body>
</html>
