# Render blueprint (#1). Deploy: push to GitHub, then in Render
# "New +" → "Blueprint" → pick this repo. Set ANTHROPIC_API_KEY / OPENAI_API_KEY
# in the dashboard (marked sync:false so they aren't committed). After first deploy,
# run the ingest once from the service shell:  python -m rag.ingest
services:
  - type: web
    name: recoup
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: recoup-db
          property: connectionString
      - key: LLM_PRIMARY
        value: anthropic
      - key: LLM_FALLBACK
        value: openai
      - key: ANTHROPIC_MODEL
        value: claude-opus-4-8
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Admin endpoints (/handoffs, /metrics, /outcome, /playbook, /llm/*) are
      # disabled unless this is set; Render generates a random value. Read it from
      # the dashboard and send it as the X-API-Key header.
      - key: RECOUP_API_KEY
        generateValue: true
      # Webhook HMAC secret; /events/payment-failed is disabled until it's set.
      - key: WEBHOOK_SECRET
        sync: false
      # Render's proxy appends the real client IP to X-Forwarded-For.
      - key: TRUST_PROXY_HEADERS
        value: "true"
      # Global LLM spend cap per rolling 24h (USD) for the public demo.
      - key: MAX_DAILY_COST_USD
        value: "5"
      # Optional live integrations — leave unset to stay in demo mode (see README
      # "Going live"). Set PUBLIC_BASE_URL to this service's URL.
      - key: PUBLIC_BASE_URL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_HASH
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_OPENING_TEMPLATE
        sync: false

databases:
  - name: recoup-db
    plan: free
    postgresMajorVersion: "16"
