<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recoup checkout</title>
  <style>
    :root { --bg:#f0f2f1; --card:#fff; --text:#111; --muted:#5a6570; --accent:#075e54; --ok:#0a7a4b; --err:#b3261e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#12151a; --card:#1b2027; --text:#e6eaee; --muted:#9aa4ae; --accent:#25a18e; --ok:#4cc38a; --err:#f2766b; }
    }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px;
           font-family:-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
    .card { width:100%; max-width:380px; background:var(--card); border-radius:14px; padding:24px;
            box-shadow:0 2px 12px rgba(0,0,0,.12); }
    h1 { font-size:18px; margin:0 0 6px; }
    p { color:var(--muted); font-size:14px; line-height:1.45; margin:0 0 18px; }
    .badge { display:inline-block; font-size:11px; letter-spacing:.04em; text-transform:uppercase;
             background:#fff5c4; color:#6b5500; border-radius:4px; padding:2px 6px; margin-bottom:12px; }
    button { width:100%; background:var(--accent); color:#fff; border:0; border-radius:10px;
             padding:12px; font-size:15px; cursor:pointer; }
    button:disabled { opacity:.6; cursor:default; }
    #status { margin-top:14px; font-size:14px; min-height:1.2em; }
    .ok { color:var(--ok); } .err { color:var(--err); }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Simulated checkout</span>
    <h1>Complete your payment</h1>
    <p>This stands in for the Paystack/Flutterwave hosted page in the demo. Paying here
      fires the same "payment succeeded" path a real processor webhook would.</p>
    <button id="pay">Pay now (simulated)</button>
    <div id="status" role="status"></div>
  </main>
<script>
const id = decodeURIComponent(location.pathname.split("/").pop());
const status = document.getElementById("status");
document.getElementById("pay").onclick = async (e) => {
  e.target.disabled = true;
  status.className = ""; status.textContent = "Processing…";
  try {
    const res = await fetch("/demo/checkout/" + encodeURIComponent(id), { method: "POST" });
    const data = await res.json().catch(() => ({}));
    if (res.ok) {
      status.className = "ok";
      status.textContent = "✓ Payment received. The conversation is marked recovered — you can close this tab.";
    } else {
      status.className = "err";
      status.textContent = "Payment failed: " + (data.detail || res.status);
      e.target.disabled = false;
    }
  } catch (err) {
    status.className = "err"; status.textContent = "Network error: " + err;
    e.target.disabled = false;
  }
};
</script>
</body>
</html>
